<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="32" height="32">
  <!-- Yoshi's head/body -->
  <ellipse cx="32" cy="38" rx="18" ry="20" fill="#4CAF50"/>
  <!-- Belly -->
  <ellipse cx="32" cy="44" rx="12" ry="13" fill="#fff"/>
  <!-- Head dome -->
  <ellipse cx="32" cy="18" rx="16" ry="14" fill="#4CAF50"/>
  <!-- Nose/snout -->
  <ellipse cx="46" cy="20" rx="10" ry="7" fill="#4CAF50"/>
  <ellipse cx="48" cy="18" rx="4" ry="3" fill="#4CAF50"/>
  <!-- Nostril -->
  <circle cx="52" cy="17" r="1.5" fill="#2E7D32"/>
  <!-- Eye white -->
  <ellipse cx="36" cy="13" rx="7" ry="8" fill="#fff"/>
  <!-- Eye pupil -->
  <ellipse cx="38" cy="13" rx="3.5" ry="5" fill="#1a1a1a"/>
  <!-- Eye highlight -->
  <circle cx="39.5" cy="11" r="1.5" fill="#fff"/>
  <!-- Shell (red) -->
  <ellipse cx="24" cy="34" rx="10" ry="12" fill="#E53935"/>
  <ellipse cx="24" cy="34" rx="7" ry="9" fill="#EF5350"/>
  <!-- Shell bumps -->
  <circle cx="20" cy="30" r="2.5" fill="#C62828"/>
  <circle cx="27" cy="28" r="2.5" fill="#C62828"/>
  <circle cx="24" cy="36" r="2.5" fill="#C62828"/>
  <!-- Arm -->
  <ellipse cx="44" cy="40" rx="5" ry="3" fill="#4CAF50" transform="rotate(-20 44 40)"/>
  <!-- Boots -->
  <ellipse cx="26" cy="58" rx="7" ry="4" fill="#FF8F00"/>
  <ellipse cx="38" cy="58" rx="7" ry="4" fill="#FF8F00"/>
</svg>
